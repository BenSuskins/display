[platformio]
default_envs = display

[env]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    zinggjm/GxEPD2@^1.5.3
    adafruit/Adafruit GFX Library@^1.11.9

; The device firmware. Secrets come from the environment rather than the repo:
;
;   export WIFI_SSID=... WIFI_PASSWORD=... DEVICE_TOKEN=...
;   export FRAME_URL=http://homelab.local:8080/frame
;   pio run -t upload
;
; An unset variable expands to an empty string, which main.cpp rejects at
; compile time rather than letting you flash a device that cannot connect.
[env:display]
build_src_filter = +<*> -<probe/> -<demo/>
build_flags =
    ${env.build_flags}
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -D FRAME_URL=\"${sysenv.FRAME_URL}\"
    -D DEVICE_TOKEN=\"${sysenv.DEVICE_TOKEN}\"
    ; Uncomment once a button is actually fitted between D3 and GND. Until then
    ; the pin is unconnected, and arming a deep-sleep wake on a floating pin
    ; invites spurious wakes. The XIAO's RESET button is the manual refresh in
    ; the meantime and needs nothing enabled here.
    ; -D WAKE_BUTTON_WIRED

; Hardware bring-up only: solid fields and a tone ramp for judging contrast.
; Shares nothing with the other environments, so it still builds mid-edit.
[env:contrast_probe]
build_src_filter = -<*> +<probe/ContrastProbe.cpp>

; Bisects the blind guard delay a partial refresh needs. The Offline Marker
; depends on the answer — see the comment at the top of the probe.
[env:partial_probe]
build_src_filter = -<*> +<probe/PartialRefreshProbe.cpp>

; The layout prototype: eight demo pages on a 15 s cycle. Superseded by
; server-side rendering (ADR-0001) and kept only so the bench comparisons in
; plans/display-prototype.md can be reproduced. Everything it needs — including
; its own DemoPage.h — lives in src/demo/, so nothing else has to know about it.
[env:demo]
build_src_filter = -<*> +<demo/>
