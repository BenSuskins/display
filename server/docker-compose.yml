services:
  display:
    build: .
    image: ghcr.io/bensuskins/display:latest
    ports:
      # Host port only. The container always listens on 8080, so FRAME_URL on
      # the device must use whatever is published here.
      - "${DISPLAY_HOST_PORT:-8080}:8080"
    environment:
      # Ansible injects the secrets; everything else has a sane default.
      - DEVICE_TOKEN=${DEVICE_TOKEN}
      - DARWIN_ACCESS_TOKEN=${DARWIN_ACCESS_TOKEN}
      - HUXLEY_BASE_URL=${HUXLEY_BASE_URL:-https://huxley2.azurewebsites.net}
      - STATION_ORIGIN=${STATION_ORIGIN:-KEL}
      - STATION_DESTINATION=${STATION_DESTINATION:-LST}
      - DEPARTURE_MIN_LEAD_MINUTES=${DEPARTURE_MIN_LEAD_MINUTES:-5}
      # Optional. Absent means that zone reports itself unconfigured rather
      # than the service refusing to start and taking the rest down with it.
      - MET_ACCESS_TOKEN=${MET_ACCESS_TOKEN:-}
      - HOME_LATITUDE=${HOME_LATITUDE:-51.8382}
      - HOME_LONGITUDE=${HOME_LONGITUDE:-0.7018}
      - HUB_ACCESS_TOKEN=${HUB_ACCESS_TOKEN:-}
      - HUB_BASE_URL=${HUB_BASE_URL:-}
      - TZ=Europe/London
    restart: unless-stopped
