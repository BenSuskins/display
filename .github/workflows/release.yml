name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: bensuskins/repo-templates/.github/workflows/publish-container.yml@main
    with:
      image: ghcr.io/bensuskins/display
      context: apps/server
      tags: |
        latest
        ${{ github.ref_name }}
