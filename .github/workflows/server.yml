name: Render Service CI

on:
  push:
    branches: [main]
    paths: ["apps/server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["apps/server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The rasteriser tests launch real Chromium rather than faking it, which
      # is the only way to catch a layout or bit-packing mistake.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Typecheck and test
        run: bun run check

  # publish-container.yml takes tag suffixes as an input, and GitHub expressions
  # have no substring function, so the short SHA has to be computed in a step.
  tag:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.short.outputs.value }}
    steps:
      - id: short
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: bensuskins/repo-templates/.github/workflows/publish-container.yml@main
    with:
      image: ghcr.io/bensuskins/display
      context: apps/server
      tags: |
        latest
        ${{ needs.tag.outputs.short-sha }}
