name: Render Service CI

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The rasteriser tests launch real Chromium rather than faking it, which
      # is the only way to catch a layout or bit-packing mistake.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Typecheck and test
        run: bun run check

  docker:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          COMMIT_SHA=${GITHUB_SHA::7}
          IMAGE_NAME=ghcr.io/bensuskins/display
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$COMMIT_SHA server/
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$COMMIT_SHA
